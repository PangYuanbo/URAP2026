<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Frame Review Tool</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101214;
      --panel: #191d20;
      --panel-2: #22272b;
      --text: #f2f5f6;
      --muted: #9aa5aa;
      --line: #343c42;
      --ok: #20c864;
      --bad: #ff5c70;
      --skip: #f2b84b;
      --accent: #45a3ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0 12px 0 0;
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
    }

    main {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(520px, 1fr) 360px;
    }

    .stage {
      min-width: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
      padding: 14px;
    }

    .toolbar,
    .status,
    aside {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 10px;
    }

    .canvas-wrap {
      min-height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #050607;
    }

    canvas {
      display: block;
      max-width: 100%;
      height: auto;
      background: #050607;
    }

    .status {
      min-height: 40px;
      padding: 9px 10px;
      color: var(--muted);
    }

    aside {
      border-radius: 0;
      border-top: 0;
      border-right: 0;
      border-bottom: 0;
      padding: 14px;
      overflow: auto;
    }

    .panel {
      display: grid;
      gap: 12px;
    }

    .section {
      display: grid;
      gap: 8px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    label {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    input,
    select,
    textarea,
    button {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel-2);
      color: var(--text);
      padding: 6px 9px;
      font: inherit;
    }

    input[type="number"] {
      width: 104px;
    }

    input[type="range"] {
      width: min(560px, 100%);
      padding: 0;
    }

    input[type="file"] {
      max-width: 240px;
    }

    textarea {
      min-height: 82px;
      resize: vertical;
    }

    button {
      cursor: pointer;
      font-weight: 700;
    }

    button.ok {
      border-color: #168f48;
      background: #116d37;
    }

    button.bad {
      border-color: #a93446;
      background: #742431;
    }

    button.skip {
      border-color: #92651d;
      background: #684714;
    }

    button.primary {
      border-color: #2378c7;
      background: #175c9c;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .stat {
      min-width: 0;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .stat b {
      display: block;
      margin-top: 3px;
      font-size: 18px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel-2);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .badge.ok {
      color: var(--ok);
      border-color: #1b8d4a;
    }

    .badge.bad {
      color: var(--bad);
      border-color: #9e3848;
    }

    .badge.skip {
      color: var(--skip);
      border-color: #8f681f;
    }

    .mini {
      color: var(--muted);
      font-size: 12px;
    }

    video {
      display: none;
    }

    @media (max-width: 980px) {
      main {
        grid-template-columns: 1fr;
      }

      aside {
        border-left: 0;
        border-top: 1px solid var(--line);
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Frame Review</h1>
      <input id="videoInput" type="file" accept="video/*" />
      <input id="jsonInput" type="file" accept="application/json,.json" />
      <button id="loadSampleVideoBtn" type="button">Load 522 Video</button>
      <button id="loadSampleBtn" type="button">Load 522 JSON</button>
      <button id="exportBtn" class="primary" type="button" disabled>Export Review</button>
    </header>

    <main>
      <section class="stage">
        <div class="toolbar">
          <button id="prevBtn" type="button" disabled>&lt;</button>
          <button id="nextBtn" type="button" disabled>&gt;</button>
          <label>
            Frame
            <input id="frameInput" type="number" min="0" step="1" value="0" />
          </label>
          <input id="frameSlider" type="range" min="0" max="0" value="0" />
          <span id="frameBadge" class="badge">No frame</span>
          <span id="sourceBadge" class="badge">No JSON</span>
        </div>

        <div class="canvas-wrap">
          <canvas id="canvas" width="1280" height="720"></canvas>
        </div>

        <div id="status" class="status">Choose a video and annotation JSON.</div>
      </section>

      <aside>
        <div class="panel">
          <div class="section">
            <div class="stats">
              <div class="stat"><span>Reviewed</span><b id="reviewedCount">0</b></div>
              <div class="stat"><span>Bad</span><b id="badCount">0</b></div>
              <div class="stat"><span>Left</span><b id="leftCount">0</b></div>
            </div>
            <div class="row">
              <button id="okBtn" class="ok" type="button" disabled>OK</button>
              <button id="badBtn" class="bad" type="button" disabled>Wrong</button>
              <button id="skipBtn" class="skip" type="button" disabled>Skip</button>
            </div>
          </div>

          <div class="section">
            <div class="grid2">
              <label>
                Start
                <input id="startInput" type="number" min="0" step="1" value="0" />
              </label>
              <label>
                End
                <input id="endInput" type="number" min="0" step="1" value="0" />
              </label>
            </div>
            <div class="row">
              <button id="applyRangeBtn" type="button" disabled>Apply Range</button>
              <button id="nextTodoBtn" type="button" disabled>Next Todo</button>
            </div>
          </div>

          <div class="section">
            <label>
              Reviewer
              <input id="reviewerInput" type="text" placeholder="name" />
            </label>
            <label>
              Note
              <textarea id="noteInput" placeholder="Optional note for current frame"></textarea>
            </label>
          </div>

          <div class="section">
            <div id="boxInfo" class="mini">No box loaded.</div>
            <div class="mini">
              Keys: left/right move, enter OK, x wrong, s skip, n next todo.
            </div>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <video id="video" muted playsinline></video>

  <script>
    const els = {
      videoInput: document.getElementById("videoInput"),
      jsonInput: document.getElementById("jsonInput"),
      loadSampleVideoBtn: document.getElementById("loadSampleVideoBtn"),
      loadSampleBtn: document.getElementById("loadSampleBtn"),
      exportBtn: document.getElementById("exportBtn"),
      prevBtn: document.getElementById("prevBtn"),
      nextBtn: document.getElementById("nextBtn"),
      frameInput: document.getElementById("frameInput"),
      frameSlider: document.getElementById("frameSlider"),
      frameBadge: document.getElementById("frameBadge"),
      sourceBadge: document.getElementById("sourceBadge"),
      status: document.getElementById("status"),
      canvas: document.getElementById("canvas"),
      video: document.getElementById("video"),
      reviewedCount: document.getElementById("reviewedCount"),
      badCount: document.getElementById("badCount"),
      leftCount: document.getElementById("leftCount"),
      okBtn: document.getElementById("okBtn"),
      badBtn: document.getElementById("badBtn"),
      skipBtn: document.getElementById("skipBtn"),
      startInput: document.getElementById("startInput"),
      endInput: document.getElementById("endInput"),
      applyRangeBtn: document.getElementById("applyRangeBtn"),
      nextTodoBtn: document.getElementById("nextTodoBtn"),
      reviewerInput: document.getElementById("reviewerInput"),
      noteInput: document.getElementById("noteInput"),
      boxInfo: document.getElementById("boxInfo"),
    };

    const ctx = els.canvas.getContext("2d");
    const state = {
      fps: 29.97002997002997,
      videoName: "",
      annotations: [],
      frameIds: [],
      byFrame: new Map(),
      review: new Map(),
      currentIndex: 0,
      currentFrame: 0,
      rangeStart: null,
      rangeEnd: null,
      videoReady: false,
      jsonReady: false,
      pendingSeekToken: 0,
    };

    function setStatus(text) {
      els.status.textContent = text;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function firstBox(annotation) {
      return annotation && annotation.boxes && annotation.boxes.length ? annotation.boxes[0] : null;
    }

    function normalizeAnnotation(annotation, fallback) {
      const frameId = Number(annotation.frame_id ?? annotation.frame ?? fallback);
      return {
        ...annotation,
        frame_id: frameId,
        source: annotation.source || "manual_or_imported",
      };
    }

    function loadAnnotationData(data, label) {
      const raw = Array.isArray(data) ? data : (data.annotations || []);
      const annotations = raw
        .map((item, index) => normalizeAnnotation(item, index))
        .filter((item) => Number.isFinite(item.frame_id) && firstBox(item));

      annotations.sort((a, b) => a.frame_id - b.frame_id);
      state.annotations = annotations;
      state.frameIds = annotations.map((item) => item.frame_id);
      state.byFrame = new Map(annotations.map((item) => [item.frame_id, item]));
      state.review.clear();
      state.currentIndex = 0;
      state.currentFrame = state.frameIds[0] || 0;
      state.fps = Number(data.fps) || state.fps;
      state.videoName = data.video_name || state.videoName || "";
      state.rangeStart = state.frameIds[0] || 0;
      state.rangeEnd = state.frameIds[state.frameIds.length - 1] || 0;
      state.jsonReady = annotations.length > 0;

      els.frameSlider.min = "0";
      els.frameSlider.max = String(Math.max(0, annotations.length - 1));
      els.frameSlider.value = "0";
      els.frameInput.value = String(state.currentFrame);
      els.startInput.value = String(state.rangeStart);
      els.endInput.value = String(state.rangeEnd);
      els.sourceBadge.textContent = label;
      els.sourceBadge.className = "badge ok";

      updateControls();
      updateStats();
      renderCurrentFrame();
      setStatus(`Loaded ${annotations.length} annotated frames.`);
    }

    function currentAnnotation() {
      return state.byFrame.get(state.currentFrame);
    }

    function currentRecord() {
      return state.review.get(state.currentFrame) || null;
    }

    function setCurrentByIndex(index) {
      if (!state.frameIds.length) return;
      state.currentIndex = clamp(index, 0, state.frameIds.length - 1);
      state.currentFrame = state.frameIds[state.currentIndex];
      els.frameInput.value = String(state.currentFrame);
      els.frameSlider.value = String(state.currentIndex);
      els.noteInput.value = currentRecord()?.note || "";
      updateControls();
      renderCurrentFrame();
    }

    function setCurrentByFrame(frameId) {
      if (!state.frameIds.length) return;
      let bestIndex = 0;
      let bestDist = Infinity;
      for (let i = 0; i < state.frameIds.length; i += 1) {
        const dist = Math.abs(state.frameIds[i] - frameId);
        if (dist < bestDist) {
          bestDist = dist;
          bestIndex = i;
        }
      }
      setCurrentByIndex(bestIndex);
    }

    function updateControls() {
      const ready = state.videoReady && state.jsonReady;
      [
        els.prevBtn,
        els.nextBtn,
        els.okBtn,
        els.badBtn,
        els.skipBtn,
        els.exportBtn,
        els.applyRangeBtn,
        els.nextTodoBtn,
      ].forEach((button) => {
        button.disabled = !ready;
      });
      els.frameInput.disabled = !state.jsonReady;
      els.frameSlider.disabled = !state.jsonReady;
      if (!state.jsonReady) {
        els.frameBadge.textContent = "No frame";
        els.frameBadge.className = "badge";
        return;
      }

      const rec = currentRecord();
      const source = currentAnnotation()?.source || "";
      els.frameBadge.textContent = rec ? `${state.currentFrame} ${rec.status}` : `${state.currentFrame}`;
      els.frameBadge.className = `badge ${rec?.status || ""}`;
      els.boxInfo.textContent = boxText(currentAnnotation(), source);
    }

    function boxText(annotation, source) {
      const box = firstBox(annotation);
      if (!box) return "No box loaded.";
      const width = Math.round((Number(box.x2) - Number(box.x1)) * 10) / 10;
      const height = Math.round((Number(box.y2) - Number(box.y1)) * 10) / 10;
      return `Frame ${annotation.frame_id} | ${source} | box ${width} x ${height} | (${Math.round(box.x1)}, ${Math.round(box.y1)})`;
    }

    function updateStats() {
      const total = state.frameIds.filter((frame) => inActiveRange(frame)).length;
      let reviewed = 0;
      let bad = 0;
      for (const frame of state.frameIds) {
        if (!inActiveRange(frame)) continue;
        const rec = state.review.get(frame);
        if (!rec) continue;
        reviewed += 1;
        if (rec.status === "bad") bad += 1;
      }
      els.reviewedCount.textContent = String(reviewed);
      els.badCount.textContent = String(bad);
      els.leftCount.textContent = String(Math.max(0, total - reviewed));
    }

    function inActiveRange(frameId) {
      const start = state.rangeStart ?? -Infinity;
      const end = state.rangeEnd ?? Infinity;
      return frameId >= start && frameId <= end;
    }

    function drawPlaceholder(text) {
      els.canvas.width = 1280;
      els.canvas.height = 720;
      ctx.fillStyle = "#050607";
      ctx.fillRect(0, 0, els.canvas.width, els.canvas.height);
      ctx.fillStyle = "#9aa5aa";
      ctx.font = "24px system-ui";
      ctx.fillText(text, 40, 70);
    }

    async function renderCurrentFrame() {
      if (!state.jsonReady) {
        drawPlaceholder("Choose an annotation JSON.");
        return;
      }
      if (!state.videoReady) {
        drawPlaceholder("Choose the matching video.");
        return;
      }
      const token = ++state.pendingSeekToken;
      const time = Math.max(0, state.currentFrame / state.fps);
      await seekVideo(time);
      if (token !== state.pendingSeekToken) return;
      drawVideoAndBoxes();
      updateControls();
    }

    function seekVideo(time) {
      return new Promise((resolve) => {
        const done = () => {
          els.video.removeEventListener("seeked", done);
          requestAnimationFrame(resolve);
        };
        els.video.addEventListener("seeked", done, { once: true });
        els.video.currentTime = time;
      });
    }

    function drawVideoAndBoxes() {
      const vw = els.video.videoWidth || 1280;
      const vh = els.video.videoHeight || 720;
      els.canvas.width = vw;
      els.canvas.height = vh;
      ctx.drawImage(els.video, 0, 0, vw, vh);

      const annotation = currentAnnotation();
      const box = firstBox(annotation);
      if (box) {
        drawBox(box, annotation.source || "");
      }

      drawOverlayLabel();
    }

    function drawBox(box, source) {
      const x1 = Number(box.x1);
      const y1 = Number(box.y1);
      const x2 = Number(box.x2);
      const y2 = Number(box.y2);
      const w = Math.max(1, x2 - x1);
      const h = Math.max(1, y2 - y1);

      ctx.save();
      ctx.lineWidth = Math.max(3, els.canvas.width / 1000);
      ctx.strokeStyle = "#23ff66";
      ctx.shadowColor = "rgba(0,0,0,0.95)";
      ctx.shadowBlur = 4;
      ctx.strokeRect(x1, y1, w, h);
      ctx.shadowBlur = 0;
      ctx.fillStyle = "rgba(0,0,0,0.62)";
      ctx.fillRect(x1, Math.max(0, y1 - 28), 250, 24);
      ctx.fillStyle = "#23ff66";
      ctx.font = `${Math.max(18, els.canvas.width / 150)}px system-ui`;
      ctx.fillText(source || "box", x1 + 7, Math.max(20, y1 - 9));
      ctx.restore();
    }

    function drawOverlayLabel() {
      const rec = currentRecord();
      const text = rec ? `Frame ${state.currentFrame} | ${rec.status.toUpperCase()}` : `Frame ${state.currentFrame}`;
      ctx.save();
      ctx.fillStyle = "rgba(0,0,0,0.72)";
      ctx.fillRect(18, 18, 420, 44);
      ctx.fillStyle = rec?.status === "bad" ? "#ff7d8e" : rec?.status === "ok" ? "#45e782" : "#f2f5f6";
      ctx.font = `${Math.max(20, els.canvas.width / 120)}px system-ui`;
      ctx.fillText(text, 32, 48);
      ctx.restore();
    }

    function mark(status) {
      if (!state.jsonReady) return;
      const note = els.noteInput.value.trim();
      const annotation = currentAnnotation();
      state.review.set(state.currentFrame, {
        frame_id: state.currentFrame,
        status,
        note,
        source: annotation?.source || "",
        reviewed_at: new Date().toISOString(),
      });
      updateStats();
      updateControls();
      drawVideoAndBoxes();
      if (status === "ok") {
        goNextTodo(true);
      }
    }

    function goNextTodo(allowNextFrame = false) {
      if (!state.frameIds.length) return;
      const start = allowNextFrame ? state.currentIndex + 1 : state.currentIndex;
      for (let i = start; i < state.frameIds.length; i += 1) {
        const frame = state.frameIds[i];
        if (inActiveRange(frame) && !state.review.has(frame)) {
          setCurrentByIndex(i);
          return;
        }
      }
      for (let i = 0; i < start; i += 1) {
        const frame = state.frameIds[i];
        if (inActiveRange(frame) && !state.review.has(frame)) {
          setCurrentByIndex(i);
          return;
        }
      }
      setStatus("No unreviewed frames in the active range.");
    }

    function applyRange() {
      const start = Number(els.startInput.value);
      const end = Number(els.endInput.value);
      if (!Number.isFinite(start) || !Number.isFinite(end) || end < start) {
        setStatus("Invalid range.");
        return;
      }
      state.rangeStart = start;
      state.rangeEnd = end;
      updateStats();
      const currentOk = inActiveRange(state.currentFrame);
      if (!currentOk) goNextTodo(false);
    }

    function exportReview() {
      const records = Array.from(state.review.values()).sort((a, b) => a.frame_id - b.frame_id);
      const payload = {
        version: 1,
        type: "interpolation_review",
        video_name: state.videoName,
        fps: state.fps,
        reviewer: els.reviewerInput.value.trim(),
        range: { start_frame: state.rangeStart, end_frame: state.rangeEnd },
        total_annotation_frames: state.frameIds.length,
        reviewed_frames: records.length,
        bad_frames: records.filter((item) => item.status === "bad"),
        records,
      };
      const blob = new Blob([JSON.stringify(payload, null, 2) + "\n"], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const name = state.videoName ? state.videoName.replace(/\.[^.]+$/, "") : "frame_review";
      a.href = url;
      a.download = `${name}_interpolation_review.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    els.videoInput.addEventListener("change", () => {
      const file = els.videoInput.files?.[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      loadVideoUrl(url, file.name);
    });

    function loadVideoUrl(url, name) {
      els.video.src = url;
      state.videoName = name;
      els.video.addEventListener("loadedmetadata", () => {
        state.videoReady = true;
        updateControls();
        renderCurrentFrame();
        setStatus(`Loaded video ${name}.`);
      }, { once: true });
    }

    els.loadSampleVideoBtn.addEventListener("click", () => {
      loadVideoUrl("../data/raw_videos/dji_fly_20260522_113924_10_1779475848691_hdrvideo.MP4", "522 DJI video");
    });

    els.jsonInput.addEventListener("change", async () => {
      const file = els.jsonInput.files?.[0];
      if (!file) return;
      try {
        loadAnnotationData(JSON.parse(await file.text()), file.name);
      } catch (error) {
        setStatus(`JSON error: ${error.message}`);
      }
    });

    els.loadSampleBtn.addEventListener("click", async () => {
      try {
        const res = await fetch("../data/annotations_522_step5_interpolated_all_frames.json");
        if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
        loadAnnotationData(await res.json(), "522 interpolated");
      } catch (error) {
        setStatus(`Sample load failed. Use the JSON picker instead. ${error.message}`);
      }
    });

    els.prevBtn.addEventListener("click", () => setCurrentByIndex(state.currentIndex - 1));
    els.nextBtn.addEventListener("click", () => setCurrentByIndex(state.currentIndex + 1));
    els.frameSlider.addEventListener("input", () => setCurrentByIndex(Number(els.frameSlider.value)));
    els.frameInput.addEventListener("change", () => setCurrentByFrame(Number(els.frameInput.value)));
    els.okBtn.addEventListener("click", () => mark("ok"));
    els.badBtn.addEventListener("click", () => mark("bad"));
    els.skipBtn.addEventListener("click", () => mark("skip"));
    els.applyRangeBtn.addEventListener("click", applyRange);
    els.nextTodoBtn.addEventListener("click", () => goNextTodo(false));
    els.exportBtn.addEventListener("click", exportReview);
    els.noteInput.addEventListener("input", () => {
      const rec = currentRecord();
      if (rec) {
        rec.note = els.noteInput.value.trim();
        state.review.set(state.currentFrame, rec);
      }
    });

    window.addEventListener("keydown", (event) => {
      if (event.target && ["INPUT", "TEXTAREA"].includes(event.target.tagName)) return;
      if (event.key === "ArrowLeft") {
        event.preventDefault();
        setCurrentByIndex(state.currentIndex - 1);
      } else if (event.key === "ArrowRight") {
        event.preventDefault();
        setCurrentByIndex(state.currentIndex + 1);
      } else if (event.key === "Enter") {
        event.preventDefault();
        mark("ok");
      } else if (event.key.toLowerCase() === "x") {
        event.preventDefault();
        mark("bad");
      } else if (event.key.toLowerCase() === "s") {
        event.preventDefault();
        mark("skip");
      } else if (event.key.toLowerCase() === "n") {
        event.preventDefault();
        goNextTodo(false);
      }
    });

    drawPlaceholder("Choose a video and annotation JSON.");
  </script>
